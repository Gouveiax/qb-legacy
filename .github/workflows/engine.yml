# Builds the slim Godot web export template (engine/custom.py) and commits it
# to the "engine-template" branch, where the game build picks it up.
name: Slim web engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
permissions:
  contents: write
env:
  GODOT_REF: 4.7-stable
  EM_VERSION: 4.0.11
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: game }
      - uses: actions/checkout@v4
        with: { repository: godotengine/godot, ref: "${{ env.GODOT_REF }}", path: godot }
      - uses: emscripten-core/setup-emsdk@v16
        with: { version: "${{ env.EM_VERSION }}", no-cache: true }
      - run: python -m pip install scons
      - name: Build
        working-directory: godot
        run: |
          cp ../game/engine/custom.py custom.py
          scons profile=custom.py -j"$(nproc)" verbose=no 2>&1 | tail -n 80
          ls -la bin
      - name: Publish to the engine-template branch
        run: |
          mkdir out && cp godot/bin/*.zip out/web_nothreads_release.zip
          cp game/engine/custom.py out/
          cd out
          git init -q -b engine-template
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Slim web template (${{ env.GODOT_REF }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" engine-template
