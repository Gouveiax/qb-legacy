# Builds the slim Godot web export template (engine/custom.py) and commits it
# to the "engine-template[-variant]" branch, where the game build picks it up.
# Variants override a few options to compare size and start-up speed.
name: Slim web engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
permissions:
  contents: write
env:
  GODOT_REF: 4.7-stable
  EM_VERSION: 4.0.20
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: "", extra: "" }
          - { variant: "-with3d", extra: "disable_3d=no" }
          - { variant: "-nodisable", extra: "disable_3d=no disable_physics_2d=no disable_physics_3d=no disable_navigation_2d=no disable_navigation_3d=no disable_xr=no" }
          - { variant: "-mods", extra: "MODS_ON" }
          - { variant: "-misc", extra: "deprecated=yes minizip=yes sdl=yes accesskit=yes" }
    steps:
      - uses: actions/checkout@v4
        with: { path: game }
      - uses: actions/checkout@v4
        with: { repository: godotengine/godot, ref: "${{ env.GODOT_REF }}", path: godot }
      - uses: emscripten-core/setup-emsdk@v16
        with: { version: "${{ env.EM_VERSION }}", no-cache: true }
      - run: python -m pip install scons
      - name: Build
        working-directory: godot
        run: |
          cp ../game/engine/custom.py custom.py
          EXTRA="${{ matrix.extra }}"
          if [ "$EXTRA" = "MODS_ON" ]; then
            # every module back on except the 3D / XR / physics ones the disable_* flags need off
            EXTRA=$(python3 -c "import re;s=open('custom.py').read();print(' '.join('module_%s_enabled=yes'%m for m in re.findall(r'\"([a-z0-9_]+)\"',s[s.index('for _m in'):]) if m not in ('godot_physics_2d','godot_physics_3d','jolt_physics','navigation_2d','navigation_3d','openxr','mobile_vr','webxr','csg','gridmap','raycast','lightmapper_rd','xatlas_unwrap','vhacd','gltf','fbx','meshoptimizer')))")
          fi
          echo "extra: $EXTRA"
          scons profile=custom.py $EXTRA -j"$(nproc)" verbose=no 2>&1 | tail -n 80
          ls -la bin
      - name: Publish
        run: |
          mkdir out && cp godot/bin/*.zip out/web_nothreads_release.zip
          cp game/engine/custom.py out/
          echo "${{ matrix.extra }}" > out/extra.txt
          cd out
          git init -q -b b
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Slim web template (${{ env.GODOT_REF }}) ${{ matrix.extra }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" b:engine-template${{ matrix.variant }}
