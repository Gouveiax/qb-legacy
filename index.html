<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QB Legacy">
<meta name="theme-color" content="#0b1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>QB Legacy</title>
<style>
/* Layout: one full-screen game canvas; a loading card centered over it until the engine starts. Single dark look by choice (it matches the game's own UI). */
:root {
  --bg: #0b1116;
  --panel: #101820;
  --fg: #e8eef2;
  --muted: #9fb3c2;
  --accent: #19b5a5;
  --warn: #ffd23f;
  --font-ui: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
/* The page never scrolls or grows: everything is pinned to the screen. On iOS a
   canvas wider than the screen (e.g. right after turning back from landscape)
   widens the page, which resizes the canvas again: a flicker loop. */
html, body { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#canvas {
  display: block;
  position: fixed;
  left: 0;
  top: 0;
  width: 100% !important;   /* the screen decides, not the engine's inline size */
  height: 100% !important;
  background: var(--bg);
  outline: none;
}
/* phones held sideways: the game is made for portrait */
#rotate {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  place-items: center;
  background: var(--bg);
  color: var(--fg);
  font: 600 18px/1.4 var(--font-ui);
  text-align: center;
  padding: 24px;
}
#rotate small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; margin-top: 6px; }
@media (orientation: landscape) and (max-height: 520px) {
  #rotate { display: grid; }
}
#loader {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
.card {
  width: min(320px, 100%);
  display: grid;
  gap: 14px;
  text-align: center;
}
.mark {
  font-weight: 800;
  font-size: 28px;
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.mark span { color: var(--accent); }
.sub { color: var(--muted); font-size: 14px; }
.bar {
  height: 10px;
  border-radius: 6px;
  background: var(--panel);
  overflow: hidden;
  border: 1px solid #24313d;
}
.bar > i {
  display: block;
  height: 100%;
  width: 4%;
  background: var(--warn);
  transition: width 0.2s ease;
}
#status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
#status.err { color: #ff8a7a; }
.yard {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>

<div id="rotate"><div>↻ <span id="rot-t">Gire o celular para a vertical</span><small id="rot-s">QB Legacy é jogado em pé.</small></div></div>

<div id="loader" role="status" aria-live="polite">
  <div class="card">
    <div class="mark"><span>QB</span> LEGACY</div>
    <div class="sub" id="sub">Carreira de quarterback</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="yard"><span>G</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div>
    <div id="status">Carregando…</div>
  </div>
</div>

<script>
// Safe-area insets (status bar / Dynamic Island, home indicator) for the game:
// measured from CSS env() into window.__qbSafe, read by the engine (SafeArea).
// "?safe=top,right,bottom,left" simulates them for testing.
(function () {
  var p = document.createElement("div");
  p.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
    "padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);" +
    "padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)";
  document.documentElement.appendChild(p);
  var m = /[?&]safe=([\d.]+),([\d.]+),([\d.]+),([\d.]+)/.exec(location.search);
  function measure() {
    var cs = getComputedStyle(p);
    return window.__qbSafe = m
      ? { t: +m[1], r: +m[2], b: +m[3], l: +m[4], h: window.innerHeight }
      : { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
          b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, h: window.innerHeight };
  }
  measure();
  window.__qbSafeNow = measure;   // the engine asks for fresh values (rotation settles late on iOS)
  window.addEventListener("resize", measure);
  window.addEventListener("orientationchange", function () { setTimeout(measure, 300); });
})();
</script>
<script>
// The engine's 39 MB wasm is published gzip-compressed (engine.gz.wasm) to fit the
// per-file limit; this shim decompresses it in the browser when Godot fetches it.
(function () {
  var WASM_SIZE = 39509339;
  var realFetch = window.fetch.bind(window);
  var pt = (navigator.language || "").toLowerCase().indexOf("pt") === 0;
  var T = pt
    ? { sub: "Carreira de quarterback · do High School ao Hall da Fama", dl: "Baixando o jogo… ", unz: "Preparando o motor…", start: "Iniciando…",
        err: "Não foi possível iniciar o jogo: ", nofeat: "Este navegador não suporta o jogo: " }
    : { sub: "Quarterback career · from High School to the Hall of Fame", dl: "Downloading… ", unz: "Preparing the engine…", start: "Starting…",
        err: "Could not start the game: ", nofeat: "This browser can't run the game: " };
  document.getElementById("sub").textContent = T.sub;
  if (!pt) {
    document.getElementById("rot-t").textContent = "Turn your phone upright";
    document.getElementById("rot-s").textContent = "QB Legacy is played in portrait.";
  }
  var statusEl = document.getElementById("status");
  var fill = document.getElementById("fill");
  function setStatus(text, frac) {
    statusEl.textContent = text;
    if (frac != null) fill.style.width = Math.max(4, Math.min(100, frac * 100)).toFixed(0) + "%";
  }
  function fail(msg) {
    statusEl.className = "err";
    statusEl.textContent = msg;
  }
  window.__qbStatus = { setStatus: setStatus, fail: fail, T: T };

  // Streams the engine: download -> gunzip -> WebAssembly compile all overlap
  // (no waiting for the whole file first). Progress counts downloaded bytes.
  async function fetchWasm(url, init) {
    var res = await realFetch(url.replace(/index\.wasm/, "engine.gz.wasm"), init);
    if (!res.ok) return res;
    var total = Number(res.headers.get("Content-Length")) || 10082553;
    var reader = res.body.getReader();
    var first = await reader.read();
    var got = 0;
    function count(chunk) {
      got += chunk.length;
      setStatus(T.dl + (got / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB", 0.05 + 0.85 * Math.min(1, got / total));
    }
    var raw = new ReadableStream({
      start: function (ctrl) {
        if (first.done) { ctrl.close(); return; }
        count(first.value);
        ctrl.enqueue(first.value);
      },
      pull: async function (ctrl) {
        var step = await reader.read();
        if (step.done) { setStatus(T.start, 0.95); ctrl.close(); return; }
        count(step.value);
        ctrl.enqueue(step.value);
      }
    });
    var head = first.done ? null : first.value;
    var gz = head && head.length > 1 && head[0] === 0x1f && head[1] === 0x8b;
    var body = gz ? raw.pipeThrough(new DecompressionStream("gzip")) : raw;
    return new Response(body, { status: 200, headers: { "Content-Type": "application/wasm", "Content-Length": String(WASM_SIZE) } });
  }

  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (/index\.wasm(\?|$)/.test(url)) return fetchWasm(url, init);
    if (/index\.pck(\?|$)/.test(url)) return realFetch(url.replace(/index\.pck/, "game.pck.wasm"), init);
    return realFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
(function () {
  var S = window.__qbStatus;
  var GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":691420,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
  var missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) {
    S.fail(S.T.nofeat + missing.join(", "));
    return;
  }
  if (typeof DecompressionStream === "undefined") {
    S.fail(S.T.nofeat + "DecompressionStream");
    return;
  }
  var engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress: function (cur, total) {
      if (total > 0 && cur < total) S.setStatus(S.T.dl, 0.05 + 0.75 * (cur / total));
    }
  }).then(function () {
    document.getElementById("loader").hidden = true;
    document.getElementById("canvas").focus();
  }).catch(function (err) {
    S.fail(S.T.err + (err && err.message ? err.message : String(err)));
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
